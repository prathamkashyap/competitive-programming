name: C++ Validation

on:
  push:
    branches:
      - main
    paths:
      - '**.cpp'
      - '**.cc'
      - '**.cxx'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cpp-validation.yml'
  pull_request:
    paths:
      - '**.cpp'
      - '**.cc'
      - '**.cxx'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cpp-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify C++ compiler
        timeout-minutes: 2
        run: |
          if command -v g++ >/dev/null 2>&1; then
            echo "Pre-installed g++ found:"
            g++ --version
            COMPILER="g++"
          elif command -v clang++ >/dev/null 2>&1; then
            echo "Pre-installed clang++ found:"
            clang++ --version
            COMPILER="clang++"
          else
            echo "No C++ compiler found on runner; performing bounded fallback installation..."
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=10
            sudo apt-get install -y -qq --no-install-recommends g++
            g++ --version
            COMPILER="g++"
          fi
          # Verify C++17 compatibility with minimal test
          echo 'int main() { return 0; }' | $COMPILER -std=c++17 -fsyntax-only -x c++ -

      - name: Verify Python installation
        timeout-minutes: 2
        run: |
          python3 --version

      - name: Run unit tests
        timeout-minutes: 3
        run: |
          python3 -m unittest discover tests

      - name: Run statistics generator
        timeout-minutes: 3
        run: |
          python3 scripts/generate_stats.py

      - name: Check generated files exist
        run: |
          test -f docs/generated/stats.md
          test -f docs/generated/problem-index.md
          test -f docs/generated/stats.json

      - name: Run C++ validation
        timeout-minutes: 10
        run: |
          python3 scripts/validate_cpp.py

      - name: Upload generated statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-stats
          path: |
            docs/generated/stats.md
            docs/generated/problem-index.md
            docs/generated/stats.json
